<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Melodia - Saint Valentin Music Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
            colors: {
              ios: {
                bg: '#F2F2F7',
                card: '#FFFFFF',
                blue: '#007AFF',
                red: '#FF2D55', // Apple Pink/Red
              },
              rose: {
                50: '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                400: '#fb7185',
                500: '#FF2D55', // Adjusted to match iOS Pink
                600: '#e11d48',
                700: '#be123c',
              }
            },
            boxShadow: {
              'ios': '0 4px 20px rgba(0, 0, 0, 0.04)',
              'ios-hover': '0 8px 30px rgba(0, 0, 0, 0.08)',
            }
          }
        }
      }
    </script>
    <style>
      /* iOS-like scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      body {
        -webkit-tap-highlight-color: transparent;
        background-color: #F2F2F7;
      }
      
      .floating-heart {
        position: absolute;
        bottom: -10%;
        animation: float 20s linear infinite;
        opacity: 0;
        z-index: 0;
      }

      @keyframes float {
        0% {
          transform: translateY(0) scale(0.5) rotate(0deg);
          opacity: 0;
        }
        20% {
          opacity: 0.2;
        }
        100% {
          transform: translateY(-100vh) scale(1) rotate(180deg);
          opacity: 0;
        }
      }

      .ios-input {
        background-color: #F2F2F7;
        transition: all 0.2s ease;
      }
      .ios-input:focus {
        background-color: #FFFFFF;
        box-shadow: 0 0 0 2px #FF2D55;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
  <body class="text-slate-900 antialiased selection:bg-rose-200 selection:text-rose-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
